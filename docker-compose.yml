version: '3'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  payment-service:
    build: ./payment-service
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_db
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: apppassword
    networks:
      - app-network

  proxy-service:
    build: ./proxy-service
    networks:
      - app-network

  order-service:
    build: ./order-service
    ports:
      - "9090:9090"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge