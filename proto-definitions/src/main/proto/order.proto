syntax = "proto3";

package order;

option java_multiple_files = true;
option java_package = "com.example.order";

service OrderService {
  rpc PlaceOrder (OrderRequest) returns (OrderResponse);
}

message OrderRequest {
  string user_id = 1;
  int32 denomination = 2;
  int32 quantity = 3;
}

message OrderResponse {
  string  order_id = 1;
  string status = 2;
}